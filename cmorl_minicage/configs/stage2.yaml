seed: 19
stage1_buffer: ""
num_extension_policies: 6
extension_rounds: 2
constrained_updates: 2
constraint_tolerance: 1.0e-6
total_timesteps_per_update: 512
semantic_penalty_coef: 0.20
semantic_penalty_weights:
  critical_hit_event: 0.40
  critical_present: 0.25
  critical_path_compromise_count: 0.15
  user_action_during_critical_breach: 0.10
  sleep_during_critical_breach: 0.05
  user_action_after_enterprise_foothold: 0.05
output_dir: cmorl_minicage/outputs/stage2
env:
  num_envs: 8
  red_policy: bline
  remove_bugs: true
  max_episode_steps: 100
  seed: 19
model:
  hidden_size: 128
  obj_dim: 3
rollout:
  num_steps: 64
eval:
  eval_episodes: 3
  preference_step:
selection:
  mode: crowding
  pool_mode: pareto
  near_frontier_quota: 6
  strict_frontier_quota: 4
ipo:
  clip_param: 0.2
  ppo_epochs: 4
  num_mini_batch: 4
  value_loss_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  barrier_coef: 20.0
  beta: 0.9
  gamma: 0.995
  gae_lambda: 0.95
  eps: 1.0e-8
